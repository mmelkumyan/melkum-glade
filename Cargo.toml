[package]
name = "castle_builder"
version = "0.1.0"
rust-version = "1.97.1"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bevy-inspector-egui = "0.38"
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
noise-functions = "0.8.5"


[features]
dev = ["bevy/dynamic_linking", "bevy/dev"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
